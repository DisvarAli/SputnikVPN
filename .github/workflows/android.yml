name: Android CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Download libv2ray.aar
        run: chmod +x scripts/download-libs.sh && ./scripts/download-libs.sh

      - name: Unit tests
        run: ./gradlew testStableDebugUnitTest --no-daemon

      - name: Assemble stable debug APK
        run: ./gradlew assembleStableDebug --no-daemon

      - name: Upload stable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-stable-debug
          path: app/build/outputs/apk/stable/debug/app-stable-debug.apk
